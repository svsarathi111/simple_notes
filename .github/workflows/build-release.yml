name: Build & Release Android App

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Node dependencies
      run: npm install
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 31
        ndk-version: '24.0.8215888'
        build-tools-version: '33.0.0'
    
    - name: Sync Capacitor to Android
      run: npx capacitor sync android
    
    - name: Make gradlew executable
      run: chmod +x android/gradlew
    
    - name: Build debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace
    
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Node dependencies
      run: npm install
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 31
        ndk-version: '24.0.8215888'
        build-tools-version: '33.0.0'
    
    - name: Sync Capacitor to Android
      run: npx capacitor sync android
    
    - name: Make gradlew executable
      run: chmod +x android/gradlew
    
    - name: Build release APK
      run: |
        cd android
        ./gradlew assembleRelease --stacktrace
    
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
        if-no-files-found: error
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: android/app/build/outputs/apk/release/app-release-unsigned.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-aab:
    name: Build App Bundle (AAB for Google Play)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Node dependencies
      run: npm install
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 31
        ndk-version: '24.0.8215888'
        build-tools-version: '33.0.0'
    
    - name: Sync Capacitor to Android
      run: npx capacitor sync android
    
    - name: Make gradlew executable
      run: chmod +x android/gradlew
    
    - name: Build App Bundle (AAB)
      run: |
        cd android
        ./gradlew bundleRelease --stacktrace
    
    - name: Upload App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: app-bundle-release
        path: android/app/build/outputs/bundle/release/app-release.aab
        retention-days: 30
        if-no-files-found: error
    
    - name: Upload AAB to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: android/app/build/outputs/bundle/release/app-release.aab
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
