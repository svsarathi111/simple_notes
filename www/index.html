<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sticky Notes">
  <meta name="theme-color" content="#fdf6e3">
  <title>Sticky Notes</title>
  <link rel="stylesheet" href="notepad-widget.css">
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: #efe9df;
      background-image: radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px);
      background-size: 18px 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    
    body {
      display: flex;
      flex-direction: column;
    }

    .app-header {
      flex-shrink: 0;
      padding: 16px 0;
      text-align: center;
      border-bottom: 1px solid rgba(46, 42, 36, 0.1);
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
    }

    .app-header h1 {
      margin: 0;
      font-size: 18px;
      color: #3f6b5e;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .app-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .app-container {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        padding: 24px;
        gap: 24px;
      }
      .npw-root {
        flex: 0 1 340px;
      }
    }

    @media (max-width: 480px) {
      .app-header h1 {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app-header">
    <h1>📝 Sticky Notes</h1>
  </div>

  <div class="app-container">
    <div id="note1"></div>
    <div id="note2"></div>
    <div id="note3"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@capacitor/core/dist/index.js" async></script>
  <script src="notepad-widget.js"></script>
  <script src="app.js"></script>
</body>
</html>
